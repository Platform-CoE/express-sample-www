name: Node.js Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
      AZURE_ACR_USERNAME: ${{ secrets.AZURE_ACR_USERNAME }}
      AZURE_ACR_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}
      BUILD_ENV: prd
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ env.AZURE_ACR_USERNAME }}
          password: ${{ env.AZURE_ACR_PASSWORD }}
      
      - name: Define Image Tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "IMAGE_TAG=pr-${{ github.event.number }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi
      
      - name: Build and tag Docker image
        run: |
          docker build -t ${{ env.AZURE_ACR_LOGIN_SERVER }}/nodejs-express:${{ env.IMAGE_TAG }} .
          docker tag ${{ env.AZURE_ACR_LOGIN_SERVER }}/nodejs-express:${{ env.IMAGE_TAG }} ${{ env.AZURE_ACR_LOGIN_SERVER }}/nodejs-express:latest
      
      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.AZURE_ACR_LOGIN_SERVER }}/nodejs-express:${{ env.IMAGE_TAG }}
          docker push ${{ env.AZURE_ACR_LOGIN_SERVER }}/nodejs-express:latest